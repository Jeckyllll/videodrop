<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="youtube-ui.css"><title>VideoDrop</title></head><body>
<header><span class="logo">↓</span><strong>VideoDrop</strong><button id="open" class="link">Открыть ↗</button></header>
<p id="page">Видео на этой странице</p><div id="youtube-settings"></div><div id="items"></div>
<label class="access"><input type="checkbox" id="access"> Передать доступ к этому сайту</label><p class="small">Нужно, если видео требует входа. Сессия выбранного сайта передаётся только приложению на этом Mac.</p>
<div id="status" role="status" aria-live="polite"></div>
<button id="capture" class="secondary">Найти потоки на странице</button><p class="small">Для сложных плееров. После включения запустите видео и откройте расширение снова.</p>
<script src="config.js"></script><script src="youtube-ui.js"></script><script src="popup.js"></script></body></html>
