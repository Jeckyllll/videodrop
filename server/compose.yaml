name: videodrop
services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: videodrop:2.0.0-preview.5
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [videodrop]
networks:
  videodrop:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-videodrop
    ipam:
      config:
        - subnet: 172.30.87.0/24
